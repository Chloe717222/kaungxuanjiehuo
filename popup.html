<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('popup.css');
  </style>
</head>
<body>
  <!-- 未配置状态 -->
  <div id="state-empty" class="state">
    <div class="welcome-icon">📖</div>
    <h1>框选解惑</h1>
    <p class="subtitle">有疑惑，用框选解惑</p>

    <div class="setup-card">
      <!-- AI 配置 -->
      <div class="step">
        <span class="step-num">1</span>
        <span>配置 AI 服务 <span class="required-tag">必填</span></span>
      </div>

      <!-- 服务商预设 -->
      <div class="field">
        <label class="mini-label">服务商</label>
        <div class="preset-chips">
          <button class="preset-chip active" data-preset="deepseek">DeepSeek</button>
          <button class="preset-chip" data-preset="openai">OpenAI</button>
          <button class="preset-chip" data-preset="custom">自定义</button>
        </div>
      </div>

      <div class="field">
        <label class="mini-label">API Key</label>
        <input type="password" id="api-key" placeholder="粘贴 API Key" autocomplete="off">
      </div>

      <div class="field" id="api-url-field" style="display:none;">
        <label class="mini-label">API 地址</label>
        <input type="text" id="api-url" placeholder="https://api.deepseek.com/v1">
      </div>

      <div class="field" id="model-field" style="display:none;">
        <label class="mini-label">模型名称</label>
        <input type="text" id="model-name" placeholder="deepseek-chat">
      </div>

      <div class="note-box">
        <strong>怎么获取 API Key？</strong><br>
        1️⃣ 打开所选服务商的官网注册<br>
        2️⃣ 进入 API Keys 页面创建密钥<br>
        3️⃣ 复制密钥粘贴到上面<br>
        💰 大部分服务商需要先充值
      </div>

      <!-- Obsidian 可选 -->
      <div class="optional-section">
        <div class="step optional-step">
          <span class="step-num optional-num">+</span>
          <span>连接 Obsidian（可选，随时可补填）</span>
        </div>
        <div class="field">
          <div class="note-box note-obsidian" style="margin-top:0;">
            <strong>需要先保存 Obsidian API Key</strong><br>
            因为这个弹窗在你切换到其他窗口时会自动关闭，请到设置页面中配置：<br><br>
            <button id="goto-options-btn" class="primary-btn" style="font-size:13px;padding:8px 0;">打开设置页面</button>
          </div>
        </div>
      </div>
    </div>

    <button id="save-btn" class="primary-btn">保存并启用</button>
    <p id="empty-status" class="status-msg"></p>
    <a href="options.html" target="_blank" class="advanced-link">高级设置 →</a>
  </div>

  <!-- 已配置状态 -->
  <div id="state-ready" class="state" style="display:none;">
    <div class="ready-header">
      <span class="ready-icon">✅</span>
      <div>
        <strong>框选解惑已就绪</strong>
        <p class="ready-hint">在任意网页框选文字即可使用</p>
      </div>
    </div>
    <div class="quick-info">
      <div class="info-row">
        <span>AI 模型</span>
        <span id="info-model" class="info-val">-</span>
      </div>
      <div class="info-row" id="obsidian-row">
        <span>Obsidian</span>
        <span id="info-obsidian" class="info-val obsidian-status">未连接</span>
      </div>
    </div>
    <div id="obsidian-cta" class="obsidian-cta">
      <span>📝 连接 Obsidian 笔记，一键保存</span>
      <a href="options.html" target="_blank">去设置 →</a>
    </div>
    <a href="options.html" target="_blank" class="settings-link">管理所有设置 →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
