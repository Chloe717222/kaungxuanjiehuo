<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>框选解惑 · AI 对话</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f;height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid #e8e8ed;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.header-icon{width:28px;height:28px;border-radius:8px}
.header-title{font-size:17px;font-weight:600;letter-spacing:-0.01em}
.header-subtitle{font-size:12px;color:#86868b}
.messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:#d2d2d7;border-radius:2px}
.welcome{text-align:center;padding:60px 20px;color:#86868b}
.welcome h2{font-size:20px;color:#1d1d1f;margin-bottom:8px}
.welcome p{font-size:14px;line-height:1.7}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.6;animation:msgIn 0.25s ease}
.msg.user{align-self:flex-end;background:#007aff;color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;color:#1d1d1f;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.msg.assistant p{margin:0}
.msg.assistant h3{font-size:15px;margin:12px 0 4px}
.msg.assistant strong{color:#1d1d1f;font-weight:700}
.msg p{margin:3px 0}
.msg p:first-child{margin-top:0}
.msg p:last-child{margin-bottom:0}
.msg.typing{color:#86868b;font-style:italic}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-area{padding:16px 24px;background:#fff;border-top:1px solid #e8e8ed;flex-shrink:0}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;padding:12px 16px;border:1px solid #d1d1d6;border-radius:14px;font-size:15px;font-family:inherit;outline:none;background:#f5f5f7;color:#1d1d1f;resize:none;min-height:44px;max-height:120px;line-height:1.5;transition:all 0.15s}
.input-row textarea:focus{border-color:#007aff;background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,0.1)}
.send-btn{padding:12px 24px;border:none;border-radius:14px;background:#007aff;color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.send-btn:hover{background:#0066d6}
.send-btn:active{background:#0055b3;transform:scale(0.97)}
.send-btn:disabled{opacity:0.4;cursor:default}
.footer-bar{display:flex;align-items:center;gap:8px;padding:10px 24px;background:#fbfbfd;border-top:1px solid #f0f0f0;flex-shrink:0}
.footer-bar label{font-size:12px;color:#86868b;flex-shrink:0}
.folder-input{flex:1;padding:6px 10px;border:1px solid #d0d0d0;border-radius:8px;font-size:12px;font-family:inherit;color:#1d1d1f;outline:none;max-width:200px;transition:border-color 0.15s}
.folder-input:focus{border-color:#007aff}
.save-way{padding:8px 14px;border:none;border-radius:10px;background:#f5f5f7;color:#1d1d1f;font-size:13px;font-family:inherit;cursor:pointer;transition:all 0.15s}
.save-way:hover{background:#e8e8ed}
.save-way.saved{background:#e3f9e5;color:#1d7a2b}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;pointer-events:none;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <img class="header-icon" src="icons/icon48.png" alt="">
    <div>
      <div class="header-title">框选解惑</div>
      <div class="header-subtitle">专治各种「这是什么？」</div>
    </div>
  </div>
</div>
<div class="messages" id="messages">
  <div class="welcome">
    <h2>你好！我是 AI 助手惑惑</h2>
    <p>随便问，我能答尽答～</p>
  </div>
</div>
<div class="footer-bar">
  <label>📁</label>
  <input type="text" class="folder-input" id="folderInput" placeholder="保存到哪个文件夹？">
  <button class="save-way" data-way="obsidian" id="saveObsidian" title="需要知识库运行中且已配置 API Key">📡 同步到知识库</button>
  <button class="save-way" data-way="download" id="saveDownload" title="下载为 Markdown 文件到本地">📥 下载文件</button>
  <button class="save-way" data-way="clipboard" id="saveClipboard" title="复制 Markdown 内容，可粘贴到任何笔记软件">📋 复制内容</button>
</div>
<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="输入你的问题... (Enter 发送)" rows="1"></textarea>
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>
<script src="chat.js"></script>
</body>
</html>
